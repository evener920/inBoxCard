<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand: double card (note stack) on blue gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- App background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Back card, slightly tilted -->
  <rect x="172" y="116" width="232" height="292" rx="30" fill="#FFFFFF" opacity="0.35" transform="rotate(9 288 262)"/>

  <!-- Front card -->
  <rect x="112" y="100" width="250" height="312" rx="34" fill="#FFFFFF"/>

  <!-- Text bars -->
  <rect x="150" y="162" width="174" height="26" rx="13" fill="#2563EB"/>
  <rect x="150" y="220" width="130" height="26" rx="13" fill="#2563EB" opacity="0.55"/>
  <rect x="150" y="278" width="152" height="26" rx="13" fill="#2563EB" opacity="0.3"/>

  <!-- Accent star dot -->
  <circle cx="302" cy="362" r="17" fill="#F59E0B"/>
</svg>
