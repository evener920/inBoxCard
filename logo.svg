<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand: 知识收集 · 松墨绿底 / 宣纸卡扇形堆叠 / 大字「知」 / 朱砂印 -->
  <defs>
    <linearGradient id="pine" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A5C4B"/>
      <stop offset="1" stop-color="#16382E"/>
    </linearGradient>
  </defs>

  <!-- App background -->
  <rect width="512" height="512" rx="112" fill="url(#pine)"/>

  <!-- 背卡两张：扇形堆叠，呼应「收集」 -->
  <rect x="176" y="128" width="234" height="278" rx="26" fill="#F5F0E4" opacity="0.20" transform="rotate(-13 293 267)"/>
  <rect x="168" y="122" width="238" height="282" rx="26" fill="#F5F0E4" opacity="0.42" transform="rotate(9 287 263)"/>

  <!-- 前卡：宣纸 -->
  <rect x="134" y="110" width="244" height="292" rx="28" fill="#F5F0E4"/>

  <!-- 大字「知」：宋体松墨 -->
  <text x="254" y="322" text-anchor="middle" font-family="'Songti SC','Noto Serif SC','STSong','SimSun',serif" font-weight="700" font-size="204" fill="#2C3E36">知</text>

  <!-- 朱砂印章 -->
  <rect x="304" y="322" width="50" height="50" rx="10" fill="#B54434"/>
  <rect x="316" y="334" width="26" height="26" rx="5" fill="#F5F0E4" opacity="0.9"/>
</svg>
