<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand: 知识收集 v5 · 宣纸米底 / 松墨绿描边卡片扇形堆叠 / 松墨绿大字「知」 / 朱砂印 -->
  <defs>
    <linearGradient id="pine" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F3E7"/>
      <stop offset="1" stop-color="#EFE6D2"/>
    </linearGradient>
  </defs>

  <!-- 宣纸米底 -->
  <rect width="512" height="512" rx="112" fill="url(#pine)"/>

  <!-- 松墨绿内描边 -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#2A5C4B" stroke-width="9" opacity="0.55"/>

  <!-- 背卡两张：扇形堆叠，松墨绿淡墨 -->
  <rect x="176" y="132" width="234" height="270" rx="26" fill="#2A5C4B" opacity="0.16" transform="rotate(-13 293 267)"/>
  <rect x="170" y="126" width="238" height="274" rx="26" fill="#2A5C4B" opacity="0.30" transform="rotate(9 287 263)"/>

  <!-- 前卡：宣纸 + 松墨绿描边 -->
  <rect x="134" y="112" width="244" height="288" rx="28" fill="#FCFAF4" stroke="#2A5C4B" stroke-width="5"/>

  <!-- 大字「知」：松墨绿 -->
  <text x="254" y="322" text-anchor="middle" font-family="'Songti SC','Noto Serif SC','STSong','SimSun',serif" font-weight="700" font-size="204" fill="#2A5C4B">知</text>

  <!-- 朱砂印章 -->
  <rect x="304" y="322" width="50" height="50" rx="10" fill="#B54434"/>
  <rect x="316" y="334" width="26" height="26" rx="5" fill="#FCFAF4" opacity="0.9"/>
</svg>
